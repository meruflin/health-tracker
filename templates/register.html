{% extends "base.html" %}
{% block title %}Register | Health Tracker{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="logo">💚</div>
    <h1>Create your account</h1>
    <p class="muted">Start keeping your health information organized.</p>

    <form method="POST">
        <label>Full name</label>
        <input type="text" name="name" required maxlength="100" autocomplete="name">

        <label>Email address</label>
        <input type="email" name="email" required maxlength="150" autocomplete="email">

        <label>Password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
        <small>Use at least 8 characters.</small>

        <button class="btn full" type="submit">Create account</button>
    </form>

    <p class="center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
